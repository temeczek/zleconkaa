app = "zlecenka"            # zmień na własną, unikalną nazwę
primary_region = "waw"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_FILE = "/data/zlecenka.db"

[[mounts]]
  source = "zlecenka_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
