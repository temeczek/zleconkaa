# fly.toml app configuration file generated for zleconkaa on 2026-10-03T00:45:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zleconkaa'
primary_region = 'fra'

[build]

[env]
  DB_FILE = '/data/zlecenka.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'zlecenka_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
